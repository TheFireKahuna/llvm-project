header: signal.h
header_template: signal.h.def
macros: []
types:
  - type_name: pid_t
  - type_name: pthread_t
  - type_name: sig_atomic_t
  - type_name: sighandler_t
  - type_name: siginfo_t
  - type_name: sigset_t
  - type_name: stack_t
  - type_name: mcontext_t
  - type_name: ucontext_t
  - type_name: struct_sigaction
  - type_name: struct_sigevent
  - type_name: union_sigval
enums: []
objects: []
functions:
  - name: kill
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: pid_t
      - type: int
  - name: killpg
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: pid_t
      - type: int
  - name: raise
    standards:
      - stdc
    return_type: int
    arguments:
      - type: int
  - name: pthread_kill
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: pthread_t
      - type: int
  - name: pthread_sigmask
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: int
      - type: const sigset_t *__restrict
      - type: sigset_t *__restrict
  - name: psiginfo
    standards:
      - POSIX
    return_type: void
    arguments:
      - type: const siginfo_t *
      - type: const char *
  - name: psignal
    standards:
      - POSIX
    return_type: void
    arguments:
      - type: int
      - type: const char *
  - name: sigaction
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: int
      - type: const struct sigaction *__restrict
      - type: struct sigaction *__restrict
  - name: sigaddset
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: sigset_t *
      - type: int
  - name: sigaltstack
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: const stack_t *__restrict
      - type: stack_t *__restrict
  - name: sigdelset
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: sigset_t *
      - type: int
  - name: sigemptyset
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: sigset_t *
  - name: sigfillset
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: sigset_t *
  - name: sigismember
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: const sigset_t *
      - type: int
  - name: signal
    standards:
      - stdc
    # May the Geneva Convention have mercy on my soul... Why this insanity?
    # Well: signal returns a function pointer to a function with no return
    # value and which accepts an int. The parameter list appears on the far
    # right of the declaration. i.e.
    # void (*signal(int, void (*)(int)))(int);
    return_type: void (*
    arguments:
      - type: int
      - type: void (*)(int)))(int
  - name: sigpending
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: sigset_t *
  - name: sigprocmask
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: int
      - type: const sigset_t *__restrict
      - type: sigset_t *__restrict
  - name: sigsuspend
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: const sigset_t *
  - name: sigtimedwait
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: const sigset_t *__restrict
      - type: siginfo_t *__restrict
      - type: const struct timespec *__restrict
  - name: sigwait
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: const sigset_t *__restrict
      - type: int *__restrict
  - name: sigqueue
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: pid_t
      - type: int
      - type: const union sigval
  - name: sigwaitinfo
    standards:
      - POSIX
    return_type: int
    arguments:
      - type: const sigset_t *__restrict
      - type: siginfo_t *__restrict
