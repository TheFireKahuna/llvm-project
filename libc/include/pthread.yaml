    standards:
      - gnu
    macro_header: pthread-macros.h
  - macro_name: "PTHREAD_RWLOCK_PREFER_READER_NP"
    standards:
      - gnu
    macro_header: pthread-macros.h
  - macro_name: "PTHREAD_RWLOCK_PREFER_WRITER_NP"
    standards:
      - gnu
    macro_header: pthread-macros.h
  - macro_name: "PTHREAD_RWLOCK_PREFER_WRITER_NONRECURSIVE_NP"
    standards:
      - gnu
    macro_header: pthread-macros.h
types:
  - type_name: pthread_t
  - type_name: pthread_once_t
  - type_name: pthread_mutex_t
  - type_name: pthread_mutexattr_t
  - type_name: pthread_barrier_t
  - type_name: pthread_barrierattr_t
  - type_name: pthread_key_t
  - type_name: pthread_cond_t
  - type_name: pthread_condattr_t
  - type_name: pthread_rwlock_t
  - type_name: pthread_rwlockattr_t
  - type_name: pthread_attr_t
  - type_name: pthread_spinlock_t
  - type_name: __pthread_cleanup_t
  # GNU pthread_*_np extensions pull in additional types:
  #   pthread_setaffinity_np / pthread_getaffinity_np    → cpu_set_t
  #   pthread_sigqueue                                   → union sigval
  # clockid_t / struct timespec are already used by pthread_cond_clockwait
  # and friends; their declarations come in via the existing flow.
  - type_name: cpu_set_t
  - type_name: union_sigval
