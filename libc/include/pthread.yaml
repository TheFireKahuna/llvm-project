header: pthread.h
header_template: pthread.h.def
standards:
  - posix
macros:
  - macro_name: "PTHREAD_NULL"
    macro_header: pthread-macros.h
  - macro_name: "PTHREAD_CREATE_JOINABLE"
    macro_header: pthread-macros.h
  - macro_name: "PTHREAD_CREATE_DETACHED"
