    Alignment:       16
    SectionData:     FF1500000000C3C3
    Relocations:
      - VirtualAddress:  2
        SymbolName:      __imp_f
        Type:            IMAGE_REL_AMD64_REL32
  - Name:            .llvm_link_records
    Characteristics: [ IMAGE_SCN_LNK_REMOVE ]
    Alignment:       1
    SectionData:     4C4C5243010302030001[[SITE]]
symbols:
  - Name:            .text
    Value:           0
    SectionNumber:   1
    SimpleType:      IMAGE_SYM_TYPE_NULL
