## A site of a form the linker does not know is a site of no form: the
## instruction is left as it is and keeps reading the local import pointer,
## which is reported.

## A call through __imp_f, described with the unknown form 7.
# RUN: yaml2obj -DSITE=27 %s -o %t.unknown.obj
# RUN: lld-link -entry:main -subsystem:console -out:%t.unknown.exe \
# RUN:   %t.unknown.obj 2>&1 | FileCheck --check-prefix=WARN %s
# RUN: llvm-objdump -d --no-show-raw-insn %t.unknown.exe | \
# RUN:   FileCheck --check-prefix=KEEP %s

# WARN: warning: {{.*}}.unknown.obj: locally defined symbol imported: f (defined in {{.*}}.unknown.obj) [LNK4217]

# KEEP: callq *0x{{[0-9a-f]+}}(%rip)

## The same call described as a call, form 1, reaches f directly.
# RUN: yaml2obj -DSITE=21 %s -o %t.call.obj
# RUN: lld-link -entry:main -subsystem:console -out:%t.call.exe %t.call.obj \
# RUN:   2>&1 | count 0
# RUN: llvm-objdump -d --no-show-raw-insn %t.call.exe | \
# RUN:   FileCheck --check-prefix=CALL %s

# CALL: addr32 callq 0x140001007

