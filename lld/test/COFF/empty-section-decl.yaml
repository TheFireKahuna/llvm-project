# REQUIRES: x86

## A SECTION-class symbol without a section names the section of that name an
## object of the same name defines, as the members of an import library do.

# RUN: rm -rf %t.dir && mkdir -p %t.dir/a %t.dir/b
# RUN: yaml2obj --docnum=1 %s -o %t.dir/a/x.obj
# RUN: yaml2obj --docnum=2 -DDATA=02000000 %s -o %t.dir/b/x.obj
# RUN: yaml2obj --docnum=2 -DDATA=03000000 %s -o %t.dir/y.obj
# RUN: llvm-ar rcs %t.dir/x.lib %t.dir/b/x.obj %t.dir/a/x.obj
# RUN: lld-link -dll -out:%t.dll %t.dir/y.obj -wholearchive:%t.dir/x.lib -noentry
# RUN: llvm-objdump -s %t.dll | FileCheck %s
# RUN: not lld-link -dll -out:%t.dll %t.dir/y.obj %t.dir/a/x.obj -noentry 2>&1 \
# RUN:   | FileCheck --check-prefix=ERR %s

# CHECK:      Contents of section .itest:
# CHECK-NEXT:  180001000 10100000 14100000 00000000 03000000
# CHECK-NEXT:  180001010 02000000 01000000

# ERR: error: {{.*}}x.obj: no object named like it defines section .itest$4

--- !COFF
header:
  Machine:         IMAGE_FILE_MACHINE_AMD64
  Characteristics: [  ]
sections:
  - Name:            '.itest$2'
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ, IMAGE_SCN_MEM_WRITE ]
    Alignment:       4
    SectionData:     '00000000000000000000'
    SizeOfRawData:   10
    Relocations:
      - VirtualAddress:  0
        SymbolName:      '.itest$4'
        Type:            IMAGE_REL_AMD64_ADDR32NB
      - VirtualAddress:  4
        SymbolName:      '.itest$6'
        Type:            IMAGE_REL_AMD64_ADDR32NB
  - Name:            '.itest$6'
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ, IMAGE_SCN_MEM_WRITE ]
    Alignment:       2
    SectionData:     01000000
    SizeOfRawData:   4
symbols:
  - Name:            '.itest$2'
    Value:           0
    SectionNumber:   1
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_NULL
    StorageClass:    IMAGE_SYM_CLASS_SECTION
  - Name:            '.itest$6'
    Value:           3221225536
    SectionNumber:   2
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_NULL
    StorageClass:    IMAGE_SYM_CLASS_SECTION
  - Name:            '.itest$4'
    Value:           3221225536
    SectionNumber:   0
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_NULL
    StorageClass:    IMAGE_SYM_CLASS_SECTION
...

--- !COFF
header:
  Machine:         IMAGE_FILE_MACHINE_AMD64
  Characteristics: [  ]
sections:
  - Name:            '.itest$4'
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ, IMAGE_SCN_MEM_WRITE ]
    Alignment:       4
    SectionData:     '[[DATA]]'
symbols:
...
