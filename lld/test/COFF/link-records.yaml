## ABI contracts, kind 7: the contract of 1T, which the code of section 1
## (symbol 0) requires of the image that provides main (symbol 2); then a
## contract cut short, a group of a symbol that is not a section's, and a row
## naming a contract the object does not have.
# RUN: yaml2obj -DDATA=4C4C52430100071A010002315400010203040506070809\
# RUN:0A0B0C0D0E0F0001020100 %s -o %t.contracts.obj
# RUN: lld-link -import-slots -entry:main -subsystem:console -out:%t.exe \
# RUN:   %t.contracts.obj
# RUN: yaml2obj -DDATA=4C4C5243010007040100053154 %s -o %t.contracts-short.obj
# RUN: yaml2obj -DDATA=4C4C52430100070300020000 %s -o %t.contracts-sym.obj
# RUN: yaml2obj -DDATA=4C4C524301000706000001020105 %s \
# RUN:   -o %t.contracts-index.obj
# RUN: not lld-link -entry:main -subsystem:console -out:%t.exe \
# RUN:   %t.contracts-short.obj %t.contracts-sym.obj %t.contracts-index.obj \
# RUN:   2>&1 | FileCheck --check-prefix=CONTRACTS %s

# CONTRACTS: error: {{.*}}.contracts-short.obj: .llvm_link_records is malformed: unexpected end of data at offset 0x4 while reading [0x3, 0x8)
# CONTRACTS: error: {{.*}}.contracts-sym.obj: .llvm_link_records is malformed: contract group of symbol 2, which is not a section's symbol
# CONTRACTS: error: {{.*}}.contracts-index.obj: .llvm_link_records is malformed: contract row naming contract 5, which the object does not have

--- !COFF
header:
  Machine:         IMAGE_FILE_MACHINE_AMD64
  Characteristics: []
sections:
  - Name:            .text
    Characteristics: [ IMAGE_SCN_CNT_CODE, IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_MEM_READ ]
    Alignment:       16
    SectionData:     C3CCCCCCCCCCCCCC
  - Name:            .llvm_link_records
    Characteristics: [ IMAGE_SCN_LNK_REMOVE ]
    Alignment:       1
    SectionData:     [[DATA]]
symbols:
  - Name:            .text
    Value:           0
    SectionNumber:   1
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_NULL
    StorageClass:    IMAGE_SYM_CLASS_STATIC
    SectionDefinition:
      Length:          8
      NumberOfRelocations: 0
      NumberOfLinenumbers: 0
      CheckSum:        0
      Number:          1
  - Name:            main
    Value:           0
    SectionNumber:   1
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_FUNCTION
    StorageClass:    IMAGE_SYM_CLASS_EXTERNAL
...
