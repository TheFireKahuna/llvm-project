# REQUIRES: x86

## A container of link records, in an object that @comp.id marks as LLVM's for
## Windows Itanium or NT-POSIX: "LLRC", version 1, flags, then groups, each a
## kind, a size and a payload. The linker defines the symbol that .drectve
## names, and the section does not reach the image.

## A Symbols group; flags the linker does not know and a group of the
## non-critical kind 20 before it.
# RUN: yaml2obj -DDATA=4C4C524301000100 %s -o %t.obj
# RUN: lld-link -entry:main -subsystem:console -out:%t.exe %t.obj
# RUN: llvm-readobj --sections %t.exe | FileCheck --check-prefix=REMOVED %s
# RUN: yaml2obj -DDATA=4C4C52430180011402AABB0100 %s -o %t.skip.obj
# RUN: lld-link -entry:main -subsystem:console -out:%t.exe %t.skip.obj

# REMOVED-NOT: .llvm_link_records

## A group of the critical kind 11, which is not assigned.
# RUN: yaml2obj -DDATA=4C4C52430100010002000B00 %s -o %t.critical.obj
# RUN: not lld-link -entry:main -subsystem:console -out:%t.exe \
# RUN:   %t.critical.obj 2>&1 | FileCheck --check-prefix=CRITICAL %s

# CRITICAL: error: {{.*}}.critical.obj: .llvm_link_records: unknown critical kind 11

## The records of an archive member that is not loaded are not read.
# RUN: rm -f %t.critical.lib
# RUN: llvm-lib %t.critical.obj -out:%t.critical.lib
# RUN: lld-link -entry:main -subsystem:console -out:%t.exe %t.obj \
# RUN:   %t.critical.lib

## Version 2, a wrong magic, a group longer than the section, and a section
## that ends in the magic.
# RUN: yaml2obj -DDATA=4C4C524302000100 %s -o %t.version.obj
# RUN: yaml2obj -DDATA=4C4C524201000100 %s -o %t.magic.obj
# RUN: yaml2obj -DDATA=4C4C5243010001000203AA %s -o %t.size.obj
# RUN: yaml2obj -DDATA=4C4C52 %s -o %t.short.obj
# RUN: not lld-link -entry:main -subsystem:console -out:%t.exe \
# RUN:   %t.version.obj %t.magic.obj %t.size.obj %t.short.obj 2>&1 | \
# RUN:   FileCheck --check-prefix=MALFORMED %s

# MALFORMED: error: {{.*}}.version.obj: .llvm_link_records: unknown version 2
# MALFORMED: error: {{.*}}.magic.obj: .llvm_link_records: bad magic
# MALFORMED: error: {{.*}}.size.obj: .llvm_link_records: unexpected end of data at offset 0xb while reading [0xa, 0xd)
# MALFORMED: error: {{.*}}.short.obj: .llvm_link_records: unexpected end of data at offset 0x3 while reading [0x0, 0x4)

## A marked object has a Symbols group; an object of another producer need
## not.
# RUN: yaml2obj -DDATA=4C4C52430100 %s -o %t.nosymbols.obj
# RUN: not lld-link -entry:main -subsystem:console -out:%t.exe \
# RUN:   %t.nosymbols.obj 2>&1 | FileCheck --check-prefix=NOSYMBOLS %s
# RUN: yaml2obj -DDATA=4C4C52430100 -DCOMPID=17104896 %s -o %t.foreign.obj
# RUN: lld-link -entry:main -subsystem:console -out:%t.exe %t.foreign.obj

# NOSYMBOLS: error: {{.*}}.nosymbols.obj: .llvm_link_records: no Symbols group

--- !COFF
header:
  Machine:         IMAGE_FILE_MACHINE_AMD64
  Characteristics: []
sections:
  - Name:            .drectve
    Characteristics: [ IMAGE_SCN_LNK_INFO, IMAGE_SCN_LNK_REMOVE ]
    Alignment:       1
    SectionData:     202F494E434C5544453A5F5F6C6C766D5F6C696E6B5F7265636F7264735F7631
  - Name:            .text
    Characteristics: [ IMAGE_SCN_CNT_CODE, IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_MEM_READ ]
    Alignment:       16
    SectionData:     C3CCCCCCCCCCCCCC
  - Name:            .llvm_link_records
    Characteristics: [ IMAGE_SCN_LNK_INFO ]
    Alignment:       1
    SectionData:     [[DATA]]
symbols:
  - Name:            '@comp.id'
    Value:           [[COMPID=1280049152]]
    SectionNumber:   -1
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_NULL
    StorageClass:    IMAGE_SYM_CLASS_STATIC
  - Name:            main
    Value:           0
    SectionNumber:   2
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_FUNCTION
    StorageClass:    IMAGE_SYM_CLASS_EXTERNAL
...
