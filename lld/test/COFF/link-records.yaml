## The link-only records: a group of a kind the linker does not know is
## skipped unless the kind is critical, and a container the linker cannot read
## in full is an error, since it may hold a critical record.

## "LLRC", version 1, no capabilities, and a group of the non-critical kind 20
## with a two-byte payload.
# RUN: yaml2obj -DDATA=4C4C524301001402AABB %s -o %t.skip.obj
# RUN: lld-link -entry:main -subsystem:console -out:%t.exe %t.skip.obj
# RUN: llvm-readobj --sections %t.exe | FileCheck --check-prefix=REMOVED %s

# REMOVED-NOT: .llvm_link_records

## No groups, and unknown capabilities.
# RUN: yaml2obj -DDATA=4C4C52430180807F %s -o %t.empty.obj
# RUN: lld-link -entry:main -subsystem:console -out:%t.exe %t.empty.obj

## The critical kind 3, whose payload is empty, is supported.
# RUN: yaml2obj -DDATA=4C4C524301000300 %s -o %t.lists.obj
# RUN: lld-link -entry:main -subsystem:console -out:%t.exe %t.lists.obj

## A group of the critical kind 11, which is not assigned.
# RUN: yaml2obj -DDATA=4C4C524301001401000B020001 %s -o %t.critical.obj
# RUN: not lld-link -entry:main -subsystem:console -out:%t.exe \
# RUN:   %t.critical.obj 2>&1 | FileCheck --check-prefix=CRITICAL %s

## The records of an archive member that is not loaded are not read.
# RUN: rm -f %t.critical.lib
# RUN: llvm-lib %t.critical.obj -out:%t.critical.lib
# RUN: lld-link -entry:main -subsystem:console -out:%t.exe %t.skip.obj \
# RUN:   %t.critical.lib

